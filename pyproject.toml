[project]
name = "hikari-api"
dynamic = ["version"]
description = "A small self-hosted API for Hikari phone status uploads."
readme = "README.md"
requires-python = ">=3.14.9"
license = "GPL-3.0-only"
authors = [{ name = "Miafetta" }]
dependencies = [
    "certifi>=2026.10.19",
    "fastapi>=0.119.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn[standard]>=0.38.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0,<1.0.0",
]

[project.scripts]
hikari-api = "hikari_api.__main__:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "hikari_api/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
